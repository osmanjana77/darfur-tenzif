<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>المواطن السوداني</title><style>
:root{--bg:#f7f5ef;--fg:#202820;--card:#fff;--accent:#315b45}body{font-family:Tahoma,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg);line-height:1.9}header{background:var(--accent);color:white;padding:24px 18px;text-align:center}main{padding:16px;max-width:760px;margin:auto}.card{background:var(--card);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}button{border:0;border-radius:9px;padding:10px 14px;margin:4px;background:var(--accent);color:white;font-size:16px}h1,h2{line-height:1.5} .muted{opacity:.75;font-size:14px}body.night{--bg:#151915;--fg:#f0f0e8;--card:#252b25;--accent:#426e54}input{width:94%;padding:10px;border-radius:8px;border:1px solid #999;font-size:16px}
</style></head><body><header><h1>المواطن السوداني</h1><div>بين وجع الحياة وأحلام الوطن</div><p>تأليف: عثمان جنا</p></header><main><div class="card"><strong>كتاب المواطن السوداني</strong><p>حكاية الإنسان السوداني بين الألم والأمل، والبحث عن وطن يسع الجميع، ويحفظ الكرامة والعدالة والسلام.</p><p class="muted">هذه نسخة أولية من التطبيق. أضف نص الكتاب الكامل إلى الفصول قبل النشر النهائي.</p><button onclick="document.body.classList.toggle('night')">الوضع الليلي</button><button onclick="changeSize(1)">تكبير الخط +</button><button onclick="changeSize(-1)">تصغير الخط −</button></div><input id="search" placeholder="ابحث في عناوين الفصول" oninput="filterChapters()"><div id="chapters"></div></main><script>
const chapters=[['المواطن السوداني','الإنسان هو أساس الوطن، وكرامته وعدالته وأمنه مسؤولية لا يجوز التفريط فيها.'],['وجع الحياة','تثقل الأزمات كاهل الأسر، لكن الأمل يبقى حياً ما دام الناس يتساندون.'],['النازحون واللاجئون','خلف كل رحلة نزوح حكاية بيتٍ تُرك وذكرياتٍ تنتظر السلام والعودة الآمنة.'],['الأمهات والأطفال','تتحمل الأمهات أعباءً كبيرة في حماية الأطفال ورعاية أحلامهم وسط الظروف الصعبة.'],['الشباب وأحلام الوطن','يستحق الشباب فرصاً للتعلم والعمل والمشاركة في بناء مستقبل أفضل.'],['دولة القانون','نريد دولة قانون ومؤسسات، لا دولة سلاح ومصالح ضيقة؛ وطناً يسع الجميع.'],['السلام والعدالة','لا يكتمل السلام دون إنصاف المتضررين، وحماية المدنيين، ومحاسبة المسؤولين وفق القانون.'],['أحلام السودان','يبقى الحلم في سودان آمن، موحد، كريم، تتساوى فيه الحقوق والفرص.']];
function render(list){document.getElementById('chapters').innerHTML=list.map(c=>`<section class="card"><h2>${c[0]}</h2><p>${c[1]}</p></section>`).join('')}function filterChapters(){let q=document.getElementById('search').value.trim();render(chapters.filter(c=>c[0].includes(q)))}function changeSize(n){let s=parseFloat(getComputedStyle(document.body).fontSize);document.body.style.fontSize=(s+n)+'px'}render(chapters);
</script></body></html>
